<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Scale Fit Fill</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="panel">
      <button id="fit" class="icon-button" type="button" title="Scale to fit selected artboard" aria-label="Scale to fit selected artboard">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="4" width="16" height="16" rx="1.5"></rect>
          <path d="M9 8H6v3"></path>
          <path d="M6 8l5 5"></path>
          <path d="M15 16h3v-3"></path>
          <path d="M18 16l-5-5"></path>
        </svg>
      </button>
      <button id="fill" class="icon-button" type="button" title="Scale to fill selected artboard" aria-label="Scale to fill selected artboard">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="5" width="14" height="14" rx="1.5"></rect>
          <path d="M4 10V4h6"></path>
          <path d="M4 4l7 7"></path>
          <path d="M20 14v6h-6"></path>
          <path d="M20 20l-7-7"></path>
        </svg>
      </button>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
